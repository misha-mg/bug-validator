services:
  bug-validator:
    build: .
    env_file: .env
    volumes:
      - ./state:/app/state
    # The container sees the host only through this volume; claude needs a writable home and tmp.
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    restart: unless-stopped
    # node is not an init: a killed claude's children are reaped by this one.
    init: true
    # A stop kills the agent run in progress; the bug loses nothing.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
