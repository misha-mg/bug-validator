[project]
name = "bug-validator-tui"
version = "0.1.0"
description = "Terminal view of the bug validator: what it checked, what it commented on, what failed"
requires-python = ">=3.10"
dependencies = ["textual>=8.0"]

[project.scripts]
bug-validator-tui = "bug_validator_tui.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
